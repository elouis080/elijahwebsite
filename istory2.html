<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Got Any Grapes?</title>
  <style>
    /* Scoped styles for istory2.html to avoid conflicts with site CSS */
    :root{
      --bg:#0b0b0b;
      --card:#151515;
      --accent:#FFD700;
      --text:#efdecd;
      --muted:#bfaea3;
    }
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:linear-gradient(180deg,#070707,var(--bg));color:var(--text);} 
    .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px;}
    .card{width:100%;max-width:880px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.12));border:1px solid rgba(255,255,255,0.03);padding:28px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.1)}
    h1{margin:0 0 8px;font-size:1.4rem;color:var(--accent)}
    #text{font-size:1.03rem;line-height:1.6;margin:12px 0 20px;color:var(--text)}
    .choices{display:flex;flex-direction:column;gap:10px}
    .choice{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--text);padding:10px 14px;border-radius:8px;text-align:left;cursor:pointer;font-weight:700;outline:none}
    .choice:hover{transform:translateY(-3px);background:rgba(255,215,0,0.03)}
    .choice:focus{box-shadow:0 0 0 4px rgba(255,215,0,0.12);border-color:var(--accent)}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px;flex-wrap:wrap}
    .controls{display:flex;gap:8px}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
    .btn:hover{color:var(--text);border-color:rgba(255,255,255,0.12)}
    .progress{font-size:0.9rem;color:var(--muted)}
    .note{font-size:0.85rem;color:var(--muted);margin-top:10px}
    .history{font-size:0.85rem;color:var(--muted);max-width:100%;overflow:auto;white-space:nowrap;margin-top:8px}
    @media (max-width:520px){.card{padding:18px}.choice{font-size:0.95rem}}
  </style>
</head>
<body>
  <div class="wrap">
    <article class="card" role="application" aria-labelledby="title">
      <h1 id="title">Got Any Grapes?</h1>

      <div id="text" aria-live="polite">Loading story…</div>

      <div class="choices" id="choices" role="list"></div>

      <div class="meta">
        <div class="controls" role="group" aria-label="Story controls">
          <button class="btn" id="backBtn" title="Go back (or press Backspace)">Back</button>
          <button class="btn" id="restartBtn" title="Restart story">Restart</button>
          <button class="btn" id="saveBtn" title="Save progress">Save</button>
          <button class="btn" id="loadBtn" title="Load saved progress">Load</button>
        </div>
        <div class="progress" id="progress">Node: —</div>
      </div>

      <div class="note" id="note">Tip: Press 1/2/3 to choose, Backspace to go back. Choices are keyboard-accessible.</div>
      <div class="history" id="history" aria-hidden="false"></div>
    </article>
  </div>

  <script>
    // Story structure (branches and options)
    const story = {
      start: {
        text: `It's a beautiful sunny day, you've decided to set up a lemonade stand.
        It's sweltering out. And your ice is melting faster than customers are showing up.
        You are approached by a duck, he looks at you expectantly.
        <br><br>
        "'Hey!' The duck says. 'You got any grapes?'”`,
        choices: [
          { text: "Give the duck grapes", next: "giveGrapes" },
          { text: "Offer the duck directions to the supermarket", next: "market" },
          { text: "Tell the duck you're selling lemonade", next: "lemonade" }
        ]
      },
      giveGrapes: {
        text: `You give the duck grapes. The duck happily eats them and follows you around forever. The end.`,
        choices: []
      },
      market: {
        text: `You offer the duck some directions to the market.
        Maybe he'll find better luck there... 
        After some time, the duck waddles back holding a bushel
        of grapes and a large bag of ice. He quacks thank you
        and plops both himself and the ice bag on the grass,
        enjoying his freshly bought grapes, and the company of 
        his new friend. The end.`,
        choices: []
      },
      lemonade: {
        text: `You offer some lemonade to the duck. He waddles away, continuing on 
        with his grape search. <i>What was up with that guy? 
        That jingle was good though. Then he waddled away, waddle 
        waddle...</i> The end.`,
        choices: []
      }
    };

    // State
    let currentId = 'start';
    const historyStack = [];

    // Elements
    const textEl = document.getElementById('text');
    const choicesEl = document.getElementById('choices');
    const progressEl = document.getElementById('progress');
    const historyEl = document.getElementById('history');
    const backBtn = document.getElementById('backBtn');
    const restartBtn = document.getElementById('restartBtn');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');

    function renderNode(id, focusChoiceIndex = 0) {
      const node = story[id];
      if (!node) return console.error('Missing node', id);
      currentId = id;

      // Update text
      textEl.innerHTML = node.text;

      // Render choices
      choicesEl.innerHTML = '';
      node.choices.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.setAttribute('role', 'listitem');
        btn.innerHTML = `<span style="opacity:.9;margin-right:8px;font-weight:600">${idx + 1}.</span><span>${c.text}</span>`;
        btn.dataset.next = c.next;
        btn.tabIndex = 0;
        btn.addEventListener('click', () => makeChoice(idx));
        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); makeChoice(idx); }
        });
        choicesEl.appendChild(btn);
      });

      // Update meta
      progressEl.textContent = `Node: ${id}`;
      historyEl.textContent = 'History: ' + historyStack.map(h => h).join(' → ');

      // Focus first choice (or requested)
      const btns = choicesEl.querySelectorAll('.choice');
      if (btns[focusChoiceIndex]) btns[focusChoiceIndex].focus();
    }

    function makeChoice(choiceIndex) {
      const node = story[currentId];
      const choice = node.choices[choiceIndex];
      if (!choice) return;
      historyStack.push(currentId);
      renderNode(choice.next);
    }

    // Controls
    backBtn.addEventListener('click', () => {
      if (historyStack.length === 0) return;
      const prev = historyStack.pop();
      renderNode(prev);
    });
    restartBtn.addEventListener('click', () => {
      historyStack.length = 0;
      renderNode('start');
    });
    saveBtn.addEventListener('click', () => {
      try {
        localStorage.setItem('istory2.current', currentId);
        localStorage.setItem('istory2.history', JSON.stringify(historyStack));
        saveBtn.textContent = 'Saved';
        setTimeout(() => saveBtn.textContent = 'Save', 1100);
      } catch (e) {
        console.error('Save failed', e);
      }
    });
    loadBtn.addEventListener('click', () => {
      const cur = localStorage.getItem('istory2.current');
      const hist = localStorage.getItem('istory2.history');
      if (cur) currentId = cur;
      if (hist) {
        try { const arr = JSON.parse(hist); historyStack.length = 0; historyStack.push(...arr); } catch (e) {}
      }
      renderNode(currentId);
      loadBtn.textContent = 'Loaded';
      setTimeout(() => loadBtn.textContent = 'Load', 1100);
    });

    // Initialize
    function init() {
      renderNode(currentId);
    }
    init();

  </script>
</body>
</html>
